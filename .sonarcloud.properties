# SonarQube Cloud Automatic Analysis configuration.
#
# Blueprint/mock catalogs and EF migration/schema artifacts are declarative, not
# duplicated executable business logic. Sonar CPD normalizes literal values, so
# registry, fixture, scenario and generated migration declarations can look like
# copy/paste even though each entry carries distinct canonical semantics.
#
# Keep these files in normal reliability/security analysis; exclude them only
# from duplication measurement.
sonar.cpd.exclusions=frontend/src/config/erpWmsBlueprint.ts,frontend/src/config/reviewRequiredScreens.ts,frontend/src/mocks/erpWmsMockData.ts,frontend/src/mocks/erpWmsMockScenarios.ts,ERP.Infrastructure/Migrations/**
