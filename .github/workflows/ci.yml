name: CI

on:
  push:
    branches:
      - handoff/approval-complete-20260906
      - feature/inbound-permission-code-authorization
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2025
    env:
      ERP_KHO_CI_SQLSERVER_SOURCE: 'Server=(localdb)\MSSQLLocalDB;Database=master;Integrated Security=True;Encrypt=False;Connect Timeout=5'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK 10.x
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Setup Node.js 24.x
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Verify Encoding
      run: pwsh -NoProfile -File scripts/check-encoding.ps1

    - name: Test Offline Capacity Guards
      run: powershell.exe -NoProfile -NonInteractive -File tools/ERP.CapacityBaseline/Test-CapacityBaselineGuards.ps1

    - name: Test Offline Capacity Runner
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        Get-ChildItem -LiteralPath tools/ERP.CapacityBaseline -Filter '*.ps1' -File | ForEach-Object {
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            throw "PowerShell parser failed for $($_.Name): $($errors -join '; ')"
          }
        }
        $workloadSyntaxPath = Join-Path $env:RUNNER_TEMP 'erp-kho-capacity-workload-syntax.mjs'
        try {
          Copy-Item -LiteralPath tools/ERP.CapacityBaseline/capacity-workload.js -Destination $workloadSyntaxPath
          node --check $workloadSyntaxPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        } finally {
          Remove-Item -LiteralPath $workloadSyntaxPath -Force -ErrorAction SilentlyContinue
        }
        powershell.exe -NoProfile -NonInteractive -File tools/ERP.CapacityBaseline/Test-CapacityRunner.ps1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Restore Backend
      run: dotnet restore ERP.slnx

    - name: Build Backend
      run: dotnet build ERP.slnx --configuration Release --no-restore

    - name: Verify Isolated SQL Server
      shell: pwsh
      timeout-minutes: 2
      run: |
        $deadline = [DateTime]::UtcNow.AddSeconds(60)
        do {
          try {
            $connection = [System.Data.SqlClient.SqlConnection]::new($env:ERP_KHO_CI_SQLSERVER_SOURCE)
            $connection.Open()
            $command = $connection.CreateCommand()
            $command.CommandText = "SELECT CASE WHEN DB_NAME() = 'master' THEN 1 ELSE 0 END"
            if ([int]$command.ExecuteScalar() -ne 1) { throw 'SQL readiness target mismatch.' }
            $command.Dispose()
            $connection.Dispose()
            Write-Output 'Local SQL Server is ready; connection details redacted.'
            exit 0
          } catch {
            if ($null -ne $connection) { $connection.Dispose() }
            if ([DateTime]::UtcNow -ge $deadline) {
              Write-Error 'Local SQL Server did not become ready within 60 seconds.'
              exit 1
            }
            Start-Sleep -Seconds 3
          }
        } while ($true)

    - name: Test Application
      timeout-minutes: 10
      env:
        ERP_KHO_SQLSERVER_ADMIN_CONNECTION: ${{ env.ERP_KHO_CI_SQLSERVER_SOURCE }}
      run: dotnet run --project tools/ERP.SqlIntegrationHarness/ERP.SqlIntegrationHarness.csproj --configuration Release --no-build

    - name: Test API
      timeout-minutes: 10
      shell: pwsh
      env:
        ERP_KHO_APPROVAL_SQLSERVER_ADMIN_CONNECTION: ${{ env.ERP_KHO_CI_SQLSERVER_SOURCE }}
      run: |
        $env:JwtSettings__Secret = [Convert]::ToBase64String(
          [Security.Cryptography.RandomNumberGenerator]::GetBytes(48)
        )
        dotnet test ERP.Api.Tests/ERP.Api.Tests.csproj --configuration Release --no-build

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Audit Frontend Dependencies
      working-directory: ./frontend
      run: npm audit --audit-level=high

    - name: Lint Frontend
      working-directory: ./frontend
      run: npm run lint

    - name: Test Frontend
      working-directory: ./frontend
      run: npm test

    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build

    # Browser QA is part of the existing build-and-test job: a failed, skipped
    # or missing real Chromium run leaves the same CI status red. JSDOM tests
    # and a Vercel READY response cannot substitute for these interactions.
    - name: Prepare real browser QA runtime
      shell: pwsh
      timeout-minutes: 12
      run: |
        $ErrorActionPreference = 'Stop'
        dotnet tool install --global dotnet-ef --version '10.*'
        if ($LASTEXITCODE -ne 0) { throw 'dotnet-ef 10 installation failed.' }
        $env:PATH += ';' + (Join-Path $env:USERPROFILE '.dotnet/tools')
        $folder = Join-Path $env:RUNNER_TEMP 'erp-kho-browserqa'
        npm install --prefix $folder --no-save --package-lock=false --ignore-scripts playwright@1.62.1
        if ($LASTEXITCODE -ne 0) { throw 'Pinned Playwright installation failed.' }
        $module = Join-Path $folder 'node_modules/playwright/index.js'
        if (!(Test-Path $module)) { throw 'Pinned Playwright module unavailable.' }
        node (Join-Path $folder 'node_modules/playwright/cli.js') install chromium
        if ($LASTEXITCODE -ne 0) { throw 'Chromium installation failed.' }

    - name: Mandatory interactive Chromium browser QA (INV-11)
      shell: pwsh
      timeout-minutes: 30
      env:
        ERP_KHO_SQLSERVER_ADMIN_CONNECTION: ${{ env.ERP_KHO_CI_SQLSERVER_SOURCE }}
      run: |
        $ErrorActionPreference = 'Stop'
        $env:PATH += ';' + (Join-Path $env:USERPROFILE '.dotnet/tools')
        $folder = Join-Path $env:RUNNER_TEMP 'erp-kho-browserqa'
        $env:ERP_KHO_PLAYWRIGHT_MODULE = Join-Path $folder 'node_modules/playwright/index.js'
        $runId = [guid]::NewGuid().ToString('N')
        $manifest = Join-Path 'TestResults/BrowserQA' "$runId/manifest.json"
        try {
          & ./tools/ERP.BrowserQa/Start-BrowserQa.ps1 -RunId $runId | Out-Null
          node tools/ERP.BrowserQa/permission-browser.mjs --manifest $manifest --case '^INV-11 interactive reconciliation and unauthorized route$'
          if ($LASTEXITCODE -ne 0) { throw 'Mandatory interactive browser QA failed.' }
          $evidenceFile = Join-Path "TestResults/BrowserQA/$runId" 'permission-browser-evidence.json'
          if (!(Test-Path $evidenceFile)) { throw 'Browser evidence missing.' }
          $evidence = Get-Content $evidenceFile -Raw | ConvertFrom-Json
          if ($evidence.sourceHead -ne $env:GITHUB_SHA) { throw 'Browser QA ran on a different commit.' }
          if ($evidence.cases.Count -ne 1 -or $evidence.cases[0].status -ne 'PASS' -or
              $evidence.cases[0].name -ne 'INV-11 interactive reconciliation and unauthorized route') {
            throw 'Mandatory browser UI case is missing, skipped, or not PASS.'
          }
          Write-Output "Chromium interaction gate passed on exact HEAD $($evidence.sourceHead.Substring(0,8))."
        } finally {
          if (Test-Path $manifest) {
            & ./tools/ERP.BrowserQa/Stop-BrowserQa.ps1 -ManifestPath $manifest
          }
        }

    - name: Upload sanitized browser QA evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: mandatory-inv11-browser-qa
        path: TestResults/BrowserQA/*/permission-browser-evidence.json
        if-no-files-found: warn
        retention-days: 14
