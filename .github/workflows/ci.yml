name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK 10.x
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Setup Node.js 24.x
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Verify Encoding
      run: pwsh -NoProfile -File scripts/check-encoding.ps1

    - name: Restore Backend
      run: dotnet restore ERP.slnx

    - name: Build Backend
      run: dotnet build ERP.slnx --no-restore

    - name: Test Application
      run: dotnet test ERP.Application.Tests/ERP.Application.Tests.csproj --no-build

    - name: Test API
      run: dotnet test ERP.Api.Tests/ERP.Api.Tests.csproj --no-build

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Audit Frontend Dependencies
      working-directory: ./frontend
      run: npm audit --audit-level=high

    - name: Lint Frontend
      working-directory: ./frontend
      run: npm run lint

    - name: Test Frontend
      working-directory: ./frontend
      run: npm test

    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build
