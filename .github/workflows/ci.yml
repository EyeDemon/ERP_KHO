name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-2025
    env:
      ERP_KHO_CI_SQLSERVER_SOURCE: 'Server=(localdb)\MSSQLLocalDB;Database=master;Integrated Security=True;Encrypt=False;Connect Timeout=5'
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup .NET SDK 10.x
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '10.x'

    - name: Setup Node.js 24.x
      uses: actions/setup-node@v4
      with:
        node-version: '24.x'
        cache: 'npm'
        cache-dependency-path: 'frontend/package-lock.json'

    - name: Verify Encoding
      run: pwsh -NoProfile -File scripts/check-encoding.ps1

    - name: Test Offline Capacity Guards
      run: powershell.exe -NoProfile -NonInteractive -File tools/ERP.CapacityBaseline/Test-CapacityBaselineGuards.ps1

    - name: Test Offline Capacity Runner
      shell: powershell
      run: |
        $ErrorActionPreference = 'Stop'
        Get-ChildItem -LiteralPath tools/ERP.CapacityBaseline -Filter '*.ps1' -File | ForEach-Object {
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
          if ($errors.Count -ne 0) {
            throw "PowerShell parser failed for $($_.Name): $($errors -join '; ')"
          }
        }
        $workloadSyntaxPath = Join-Path $env:RUNNER_TEMP 'erp-kho-capacity-workload-syntax.mjs'
        try {
          Copy-Item -LiteralPath tools/ERP.CapacityBaseline/capacity-workload.js -Destination $workloadSyntaxPath
          node --check $workloadSyntaxPath
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        } finally {
          Remove-Item -LiteralPath $workloadSyntaxPath -Force -ErrorAction SilentlyContinue
        }
        powershell.exe -NoProfile -NonInteractive -File tools/ERP.CapacityBaseline/Test-CapacityRunner.ps1
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Restore Backend
      run: dotnet restore ERP.slnx

    - name: Build Backend
      run: dotnet build ERP.slnx --configuration Release --no-restore

    - name: Verify Isolated SQL Server
      shell: pwsh
      timeout-minutes: 2
      run: |
        $deadline = [DateTime]::UtcNow.AddSeconds(60)
        do {
          try {
            $connection = [System.Data.SqlClient.SqlConnection]::new($env:ERP_KHO_CI_SQLSERVER_SOURCE)
            $connection.Open()
            $command = $connection.CreateCommand()
            $command.CommandText = "SELECT CASE WHEN DB_NAME() = 'master' THEN 1 ELSE 0 END"
            if ([int]$command.ExecuteScalar() -ne 1) { throw 'SQL readiness target mismatch.' }
            $command.Dispose()
            $connection.Dispose()
            Write-Output 'Local SQL Server is ready; connection details redacted.'
            exit 0
          } catch {
            if ($null -ne $connection) { $connection.Dispose() }
            if ([DateTime]::UtcNow -ge $deadline) {
              Write-Error 'Local SQL Server did not become ready within 60 seconds.'
              exit 1
            }
            Start-Sleep -Seconds 3
          }
        } while ($true)

    - name: Test Application
      timeout-minutes: 10
      env:
        ERP_KHO_SQLSERVER_ADMIN_CONNECTION: ${{ env.ERP_KHO_CI_SQLSERVER_SOURCE }}
      run: dotnet run --project tools/ERP.SqlIntegrationHarness/ERP.SqlIntegrationHarness.csproj --configuration Release --no-build

    - name: Test API
      timeout-minutes: 10
      shell: pwsh
      env:
        ERP_KHO_APPROVAL_SQLSERVER_ADMIN_CONNECTION: ${{ env.ERP_KHO_CI_SQLSERVER_SOURCE }}
      run: |
        $env:JwtSettings__Secret = [Convert]::ToBase64String(
          [Security.Cryptography.RandomNumberGenerator]::GetBytes(48)
        )
        dotnet test ERP.Api.Tests/ERP.Api.Tests.csproj --configuration Release --no-build

    - name: Install Frontend Dependencies
      working-directory: ./frontend
      run: npm ci

    - name: Audit Frontend Dependencies
      working-directory: ./frontend
      run: npm audit --audit-level=high

    - name: Lint Frontend
      working-directory: ./frontend
      run: npm run lint

    - name: Test Frontend
      working-directory: ./frontend
      run: npm test

    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build
