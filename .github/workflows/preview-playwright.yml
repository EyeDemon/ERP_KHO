name: PR33 Playwright Preview QA

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feature/erp-wms-complete-ui-blueprint
    paths:
      - '.github/workflows/preview-playwright.yml'
      - 'frontend/e2e/blueprint-preview.spec.mjs'
      - 'frontend/package.json'
      - 'frontend/src/layouts/MainLayout.css'
      - 'frontend/src/pages/InventoryReconciliation.css'
      - 'frontend/src/pages/InventoryReconciliation.tsx'
      - 'frontend/src/pages/InventoryReversals.tsx'
      - 'frontend/src/pages/InventoryTraceability.tsx'
      - 'frontend/src/pages/SystemBlueprint.tsx'

permissions:
  contents: read

jobs:
  preview-browser:
    if: github.event.pull_request.number == 33 || github.event.pull_request.number == 31
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install isolated Playwright QA dependencies
        working-directory: frontend
        run: |
          npm ci --ignore-scripts
          npm install --ignore-scripts --no-save --package-lock=false @playwright/test@1.56.1
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Verify live PR Preview with Chromium
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: ${{ github.event.pull_request.number == 31 && 'https://erp-wms-blueprint-demo-git-part-inven-d4882a-bayuuandree99-8132.vercel.app' || 'https://erp-wms-blueprint-demo-git-part-syste-b0b8f5-bayuuandree99-8132.vercel.app' }}
          CI: 'true'
        run: ./node_modules/.bin/playwright test e2e/blueprint-preview.spec.mjs --browser=chromium --workers=1 --retries=0 --reporter=line
