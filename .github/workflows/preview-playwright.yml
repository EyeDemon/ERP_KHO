name: PR33 Playwright Preview QA

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - feature/erp-wms-complete-ui-blueprint
    paths:
      - '.github/workflows/preview-playwright.yml'
      - 'frontend/e2e/blueprint-preview.spec.mjs'
      - 'frontend/package.json'
      - 'frontend/src/layouts/MainLayout.css'
      - 'frontend/src/pages/InventoryReconciliation.css'
      - 'frontend/src/pages/InventoryReconciliation.tsx'
      - 'frontend/src/pages/SystemBlueprint.tsx'

permissions:
  contents: read
  checks: read

jobs:
  preview-browser:
    if: github.event.pull_request.number == 33
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.x'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install isolated Playwright QA dependencies
        working-directory: frontend
        run: |
          npm ci
          npm install --no-save --package-lock=false @playwright/test@1.56.1
          npx playwright install --with-deps chromium
      - name: Verify live PR Preview with Chromium
        working-directory: frontend
        env:
          PLAYWRIGHT_BASE_URL: https://erp-wms-blueprint-demo-git-part-syste-b0b8f5-bayuuandree99-8132.vercel.app
          CI: 'true'
        run: npx playwright test e2e/blueprint-preview.spec.mjs --browser=chromium --workers=1 --retries=0 --reporter=line
      - name: Diagnose SonarCloud PR issue metadata (unauthenticated, read-only)
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import json
          import urllib.error
          import urllib.parse
          import urllib.request

          url = 'https://sonarcloud.io/api/issues/search?' + urllib.parse.urlencode({
              'componentKeys': 'EyeDemon_ERP_KHO',
              'pullRequest': '33',
              'ps': '100',
          })
          try:
              with urllib.request.urlopen(urllib.request.Request(url, headers={'Accept': 'application/json'}), timeout=15) as response:
                  data = json.load(response)
          except urllib.error.HTTPError as error:
              print('SONAR_ISSUES_READ_UNAVAILABLE: HTTP', error.code)
          except (OSError, ValueError) as error:
              print('SONAR_ISSUES_READ_UNAVAILABLE:', type(error).__name__)
          else:
              print('SONAR_ISSUES_COUNT:', data.get('total', 'unknown'))
              for issue in data.get('issues', []):
                  print(json.dumps({
                      'rule': issue.get('rule'),
                      'type': issue.get('type'),
                      'severity': issue.get('severity'),
                      'message': issue.get('message'),
                      'component': issue.get('component'),
                      'line': issue.get('line'),
                  }, ensure_ascii=False))
          PY
      - name: Diagnose SonarCloud GitHub check annotations (read-only)
        if: always()
        shell: bash
        env:
          GH_READ_TOKEN: ${{ github.token }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          GH_REPOSITORY: ${{ github.repository }}
        run: |
          python - <<'PY'
          import json, os, urllib.error, urllib.request
          root = 'https://api.github.com/repos/' + os.environ['GH_REPOSITORY']
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': 'Bearer ' + os.environ['GH_READ_TOKEN'],
              'X-GitHub-Api-Version': '2022-11-28',
          }
          def get(path):
              req = urllib.request.Request(root + path, headers=headers)
              with urllib.request.urlopen(req, timeout=15) as response:
                  return json.load(response)
          try:
              checks = get('/commits/' + os.environ['PR_HEAD_SHA'] + '/check-runs?per_page=100')
              sonar = [c for c in checks.get('check_runs', []) if c.get('name') == 'SonarCloud Code Analysis']
              print('SONAR_GITHUB_CHECKS:', len(sonar))
              for check in sonar:
                  print('SONAR_GITHUB_STATUS:', check.get('status'), check.get('conclusion'))
                  data = get('/check-runs/' + str(check['id']) + '/annotations?per_page=100')
                  print('SONAR_GITHUB_ANNOTATIONS:', len(data))
                  for issue in data:
                      print('SONAR_GITHUB_ANNOTATION:', json.dumps({
                          'path': issue.get('path'),
                          'line': issue.get('start_line'),
                          'level': issue.get('annotation_level'),
                          'title': issue.get('title'),
                          'message': issue.get('message'),
                      }, ensure_ascii=False))
          except (urllib.error.HTTPError, urllib.error.URLError, ValueError) as error:
              print('SONAR_GITHUB_READ_BLOCKED:', type(error).__name__, getattr(error, 'code', ''))
          PY
