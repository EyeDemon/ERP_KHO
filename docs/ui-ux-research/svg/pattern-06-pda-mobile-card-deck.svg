<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 390 844" width="100%" height="100%" font-family="Inter, 'Be Vietnam Pro', system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .num { font-variant-numeric: tabular-nums; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-variant-numeric: tabular-nums; }
    </style>
  </defs>

  <!-- PDA Viewport Background (390x844) -->
  <rect width="390" height="844" fill="#F8FAFC" />

  <!-- Compact Mobile Topbar (Y=0..56px) -->
  <rect x="0" y="0" width="390" height="56" fill="#0F172A" />
  <text x="16" y="24" fill="#94A3B8" font-size="10" font-weight="700">KHO WH01 • LẤY HÀNG THEO CỤM (FEFO)</text>
  <text x="16" y="44" fill="#FFFFFF" font-size="15" font-weight="700">Nhiệm vụ: PICK-2026-441 (Dòng 3/8)</text>
  <rect x="304" y="14" width="72" height="28" rx="14" fill="#059669" />
  <text x="340" y="32" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle" class="num">38% Xong</text>

  <!-- Sticky Barcode Scanner Input Bar (Y=66..126px) -->
  <rect x="12" y="66" width="366" height="56" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="2" />
  <text x="26" y="88" fill="#047857" font-size="11" font-weight="700">||||| Ô QUÉT MÃ VẠCH TỰ ĐỘNG (SÚNG PDA / CAMERA)</text>
  <text x="26" y="110" fill="#0F172A" font-size="14" font-weight="600" class="mono">Quét Bin A-02-04-B1 hoặc SKU...</text>
  <rect x="324" y="74" width="44" height="40" rx="6" fill="#ECFDF5" />
  <text x="346" y="99" fill="#047857" font-size="16" text-anchor="middle">📷</text>

  <!-- STEP 1 CARD: Destination Location / Bin (Y=134..274px) -->
  <rect x="12" y="134" width="366" height="136" rx="10" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
  <rect x="12" y="134" width="366" height="32" rx="10" fill="#F2F3F4" />
  <text x="26" y="155" fill="#334155" font-size="11" font-weight="700">BƯỚC 1: ĐI TỚI VỊ TRÍ KỆ LẤY HÀNG (BIN LOCATION)</text>
  <rect x="282" y="139" width="84" height="22" rx="11" fill="#ECFDF5" />
  <text x="324" y="154" fill="#047857" font-size="11" font-weight="700" text-anchor="middle">✓ Đã quét kệ</text>

  <text x="26" y="192" fill="#64748B" font-size="12" font-weight="600">Khu Hàng Nhanh (ZONE-A) → Dãy 02 → Kệ 04 → Tầng 1</text>
  <text x="26" y="232" fill="#0F172A" font-size="30" font-weight="800" class="mono">A-02-04-B1</text>
  <text x="26" y="256" fill="#047857" font-size="12" font-weight="700">Chiến lược FEFO: Bắt buộc lấy đúng Lô LOT-202610</text>

  <!-- STEP 2 CARD: SKU, Lot & Quantity Counter (Y=282..576px) -->
  <rect x="12" y="282" width="366" height="294" rx="10" fill="#FFFFFF" stroke="#334155" stroke-width="2" />
  <rect x="12" y="282" width="366" height="32" rx="8" fill="#334155" />
  <text x="26" y="303" fill="#FFFFFF" font-size="11" font-weight="700">BƯỚC 2: QUÉT SẢN PHẨM &amp; BỎ VÀO Ô GIỎ CHIA</text>

  <text x="26" y="338" fill="#0F172A" font-size="16" font-weight="700" class="mono">SKU-MILK-900G</text>
  <text x="26" y="360" fill="#0F172A" font-size="14" font-weight="600">Sữa bột dinh dưỡng trẻ em lon 900g</text>
  <text x="26" y="382" fill="#92400E" font-size="12" font-weight="700" class="mono">Lô: LOT-202610 • HSD: 15/12/2027 • ĐVT: Lon</text>

  <!-- Large Touch-Friendly Quantity Controls (>= 48px height) -->
  <rect x="26" y="396" width="338" height="72" rx="8" fill="#F8FAFC" stroke="#CBD5E1" />
  <rect x="36" y="408" width="64" height="48" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
  <text x="68" y="438" fill="#334155" font-size="20" font-weight="700" text-anchor="middle">−1</text>

  <text x="165" y="426" fill="#64748B" font-size="11" font-weight="700" text-anchor="middle">SỐ LƯỢNG ĐÃ QUÉT</text>
  <text x="165" y="454" fill="#047857" font-size="24" font-weight="800" text-anchor="middle" class="num">4 / 6 Lon</text>

  <rect x="226" y="408" width="64" height="48" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
  <text x="258" y="438" fill="#334155" font-size="20" font-weight="700" text-anchor="middle">+1</text>

  <rect x="296" y="408" width="58" height="48" rx="6" fill="#ECFDF5" stroke="#059669" />
  <text x="325" y="437" fill="#047857" font-size="13" font-weight="700" text-anchor="middle">Đủ 6</text>

  <!-- Put-to-Wall Target Slot Highlight -->
  <rect x="26" y="480" width="338" height="82" rx="8" fill="#ECFDF5" stroke="#059669" stroke-width="2" />
  <text x="195" y="504" fill="#047857" font-size="11" font-weight="700" text-anchor="middle">BỎ HÀNG VÀO Ô TƯỜNG CHIA (PUT-TO-WALL):</text>
  <text x="195" y="536" fill="#047857" font-size="26" font-weight="800" text-anchor="middle" class="mono">👉 Ô SỐ: SLOT-03</text>
  <text x="195" y="554" fill="#0F172A" font-size="12" font-weight="600" text-anchor="middle">(Đơn hàng #SO-99220 • Khách: Trần Minh)</text>

  <!-- Secondary Exception Actions (Y=588..636px) -->
  <rect x="12" y="588" width="178" height="48" rx="8" fill="#FEF2F2" stroke="#FCA5A5" />
  <text x="101" y="617" fill="#B91C1C" font-size="13" font-weight="700" text-anchor="middle">⚠️ Báo thiếu / Hỏng</text>

  <rect x="200" y="588" width="178" height="48" rx="8" fill="#FFFFFF" stroke="#CBD5E1" />
  <text x="289" y="617" fill="#334155" font-size="13" font-weight="600" text-anchor="middle">Qua dòng kế (4/8) →</text>

  <!-- Primary Single-Thumb Confirm CTA (Y=648..704px, height=56px) -->
  <rect x="12" y="648" width="366" height="56" rx="10" fill="#059669" />
  <text x="195" y="682" fill="#FFFFFF" font-size="16" font-weight="700" text-anchor="middle">✓ XÁC NHẬN ĐÃ LẤY &amp; QUA BIN TIẾP THEO</text>

  <!-- Progress Dots -->
  <text x="195" y="732" fill="#64748B" font-size="12" text-anchor="middle">Tự động gắn Idempotency-Key chống gửi trùng khi mạng kho yếu</text>

  <!-- PDA Bottom Navigation (.app-bottom-nav, Y=772..844px, 5 buttons) -->
  <rect x="0" y="772" width="390" height="72" fill="#0F172A" />
  <text x="39" y="818" fill="#94A3B8" font-size="11" font-weight="600" text-anchor="middle">Tổng quan</text>
  <text x="117" y="818" fill="#94A3B8" font-size="11" font-weight="600" text-anchor="middle">Nhận hàng</text>
  <text x="195" y="818" fill="#94A3B8" font-size="11" font-weight="600" text-anchor="middle">Cất hàng</text>
  <rect x="236" y="778" width="74" height="58" rx="8" fill="#1E293B" stroke="#059669" stroke-width="1.5" />
  <text x="273" y="818" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">● Lấy hàng</text>
  <text x="351" y="818" fill="#94A3B8" font-size="11" font-weight="600" text-anchor="middle">Kiểm kê</text>
</svg>
