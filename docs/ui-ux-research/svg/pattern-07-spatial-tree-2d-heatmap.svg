  <text x="58" y="424" fill="#475569" font-size="13">▶ ❄️ ZONE-COLD: Kho Mát (18°C–22°C)</text>
  <text x="58" y="456" fill="#92400E" font-size="13" font-weight="600">▶ ⚠️ ZONE-QC: Khu Cách ly &amp; Hàng hoàn</text>
  <text x="58" y="488" fill="#475569" font-size="13">▶ 🚚 ZONE-STAGE: Khu Tập kết Xuất/Nhập</text>

