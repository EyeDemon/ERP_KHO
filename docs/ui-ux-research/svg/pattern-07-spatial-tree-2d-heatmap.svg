  <text x="78" y="242" fill="#0F172A" font-size="13" font-weight="600">▼ 🛣️ AISLE-A01: Dãy kệ số 01</text>

  <!-- Selected Rack Node -->
  <rect x="92" y="254" width="246" height="32" rx="6" fill="#ECFDF5" stroke="#059669" />
  <text x="104" y="275" fill="#047857" font-size="12" font-weight="700">▼ 🗄️ RACK-A01 (Kệ 01 — Đang xem)</text>

  <text x="116" y="306" fill="#334155" font-size="12" font-weight="600">├─ Tầng L3 (Trên cao — 4 Ô Bin)</text>
  <text x="116" y="332" fill="#047857" font-size="12" font-weight="700">├─ Tầng L2 (Vừa tầm tay — Đang chọn B2)</text>
