<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="100%" height="100%" font-family="Inter, 'Be Vietnam Pro', system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .num { font-variant-numeric: tabular-nums; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-variant-numeric: tabular-nums; }
    </style>
  </defs>

  <rect width="1200" height="680" fill="#F8FAFC" />

  <text x="24" y="34" fill="#475569" font-size="11" font-weight="700" letter-spacing="0.08em">MẪU 07: CÂY CẤU TRÚC KHO 5 TẦNG + BẢN ĐỒ NHIỆT 2D &amp; THANH SỨC CHỨA 3 CHIỀU</text>
  <text x="24" y="60" fill="#0F172A" font-size="20" font-weight="700">Trực quan hóa Không gian Kho (Zone → Aisle → Rack → Level → Bin) • Y = 80px</text>

  <rect x="990" y="32" width="186" height="36" rx="6" fill="#334155" />
  <text x="1083" y="55" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">+ Thêm vị trí (Drawer)</text>

  <!-- LEFT PANE: 5-Level Hierarchy Tree (X=24..354, Y=80..656) -->
  <rect x="24" y="80" width="330" height="576" rx="8" fill="#FFFFFF" stroke="#E6E8EA" />
  <text x="40" y="108" fill="#0F172A" font-size="14" font-weight="700">Cây Phân cấp Kho 5 Tầng</text>
