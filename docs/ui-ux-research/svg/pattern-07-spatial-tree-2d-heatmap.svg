  <text x="428" y="610" fill="#0F172A" font-size="12" font-weight="600" class="mono">• SKU-MILK-02 (Sữa dâu 180ml)| Lô: LOT-202611 | HSD: 20/08/2027 | Thực tế: 150 Lốc | Khả dụng: 150 Lốc</text>
