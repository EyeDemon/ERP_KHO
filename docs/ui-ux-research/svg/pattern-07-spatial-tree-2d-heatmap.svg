  <rect x="54" y="550" width="14" height="14" rx="3" fill="#F8FAFC" stroke="#CBD5E1" /><text x="76" y="562" fill="#475569" font-size="11">0% (Ô trống hoàn toàn)</text>
  <rect x="54" y="572" width="14" height="14" rx="3" fill="#ECFDF5" stroke="#059669" /><text x="76" y="584" fill="#047857" font-size="11">1% – 70% (Tối ưu, sẵn sàng Putaway)</text>
  <rect x="54" y="594" width="14" height="14" rx="3" fill="#FFFBEB" stroke="#F59E0B" /><text x="76" y="606" fill="#92400E" font-size="11">71% – 90% (Sắp đầy - Cảnh báo vàng)</text>
  <rect x="54" y="616" width="14" height="14" rx="3" fill="#FEF2F2" stroke="#EF4444" /><text x="76" y="628" fill="#B91C1C" font-size="11">&gt; 90% Đầy hoặc Đang khóa tồn (🔒)</text>

