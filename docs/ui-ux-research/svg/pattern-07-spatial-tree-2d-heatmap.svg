  <text x="394" y="132" fill="#64748B" font-size="12">Nhấp trực tiếp vào từng ô Bin để xem danh sách Lô hàng, kiểm tra 3 giới hạn sức chứa hoặc in nhãn mã vạch vị trí.</text>

