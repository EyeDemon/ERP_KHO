<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="100%" height="100%" font-family="Inter, 'Be Vietnam Pro', system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .num { font-variant-numeric: tabular-nums; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-variant-numeric: tabular-nums; }
    </style>
  </defs>

  <!-- App Background -->
  <rect width="1440" height="900" fill="#F8FAFC" />

  <!-- Left Sidebar (250px x 900px, #0F172A) -->
  <rect x="0" y="0" width="250" height="900" fill="#0F172A" />
  <text x="20" y="38" fill="#FFFFFF" font-size="16" font-weight="700">ERP_KHO v3.0</text>
  <rect x="148" y="22" width="84" height="22" rx="4" fill="#059669" />
  <text x="190" y="37" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">WMS SaaS</text>

  <!-- Sidebar Quick Filter -->
  <rect x="16" y="56" width="218" height="32" rx="6" fill="#1E293B" stroke="#334155" />
  <text x="28" y="76" fill="#94A3B8" font-size="12">Tìm nhanh menu... (/)</text>

  <!-- Sidebar Sections -->
  <text x="20" y="114" fill="#64748B" font-size="11" font-weight="700" letter-spacing="0.06em">ĐIỀU HÀNH &amp; DANH MỤC</text>
  <rect x="12" y="124" width="226" height="36" rx="6" fill="transparent" />
  <text x="28" y="147" fill="#CBD5E1" font-size="13" font-weight="500">Tổng quan (Dashboard)</text>

  <rect x="12" y="164" width="226" height="36" rx="6" fill="#1E293B" stroke="#059669" stroke-width="1.5" />
  <text x="28" y="187" fill="#FFFFFF" font-size="13" font-weight="700">Sản phẩm &amp; Quy cách UOM</text>

  <text x="28" y="227" fill="#CBD5E1" font-size="13">Cấu trúc Kho &amp; Vị trí (Bin)</text>
  <text x="28" y="263" fill="#CBD5E1" font-size="13">Bản đồ nhiệt Kho 2D</text>
  <text x="28" y="299" fill="#CBD5E1" font-size="13">Đối tác &amp; Công nợ 3PL</text>

  <text x="20" y="345" fill="#64748B" font-size="11" font-weight="700" letter-spacing="0.06em">LUỒNG NHẬP KHO (INBOUND)</text>
  <text x="28" y="372" fill="#CBD5E1" font-size="13">Cổng &amp; Bãi xe (Dock &amp; Yard)</text>
  <text x="28" y="408" fill="#CBD5E1" font-size="13">Đơn mua (PO) &amp; ASN</text>
  <text x="28" y="444" fill="#CBD5E1" font-size="13">Phiếu nhập kho &amp; QC/RMA</text>
  <text x="28" y="480" fill="#CBD5E1" font-size="13">Nhiệm vụ Cất hàng (Putaway)</text>

  <text x="20" y="526" fill="#64748B" font-size="11" font-weight="700" letter-spacing="0.06em">LUỒNG XUẤT KHO (OUTBOUND)</text>
  <text x="28" y="553" fill="#CBD5E1" font-size="13">Phân bổ FEFO &amp; Lấy hàng</text>
  <text x="28" y="589" fill="#CBD5E1" font-size="13">Bàn Đóng gói &amp; Video SHA256</text>
  <text x="28" y="625" fill="#CBD5E1" font-size="13">Bàn giao Bưu tá (Manifest)</text>

  <!-- Topbar (Y=0..68px, #FFFFFF) -->
  <rect x="250" y="0" width="1190" height="68" fill="#FFFFFF" stroke="#E6E8EA" />
  <!-- Warehouse Switcher -->
  <rect x="274" y="16" width="230" height="36" rx="6" fill="#F8FAFC" stroke="#CBD5E1" />
  <circle cx="292" cy="34" r="5" fill="#059669" />
  <text x="306" y="39" fill="#0F172A" font-size="13" font-weight="700">Kho Trung tâm (WH01) ▾</text>

  <!-- Global Command Palette Trigger -->
  <rect x="520" y="16" width="380" height="36" rx="6" fill="#F8FAFC" stroke="#CBD5E1" />
  <text x="536" y="39" fill="#64748B" font-size="13">Tìm nhanh SKU, Bin, Phiếu nhập/xuất, AWB...</text>
  <rect x="836" y="22" width="54" height="24" rx="4" fill="#E2E8F0" />
  <text x="863" y="38" fill="#334155" font-size="11" font-weight="700" text-anchor="middle">Ctrl+K</text>

  <!-- Express/Full Mode Toggle -->
  <rect x="1040" y="16" width="210" height="36" rx="6" fill="#ECFDF5" stroke="#059669" />
  <text x="1145" y="39" fill="#047857" font-size="12" font-weight="700" text-anchor="middle">⚡ Chế độ Rút gọn (16 mục)</text>

  <rect x="1264" y="16" width="152" height="36" rx="6" fill="#F8FAFC" stroke="#E6E8EA" />
  <text x="1340" y="39" fill="#0F172A" font-size="12" font-weight="600" text-anchor="middle">qa_admin • Quản trị</text>

  <!-- ZONE 1: UiPageHeader (Y=82..136px) -->
  <text x="274" y="98" fill="#475569" font-size="11" font-weight="700" letter-spacing="0.08em">DANH MỤC MASTER DATA • KHO WH01</text>
  <text x="274" y="124" fill="#0F172A" font-size="22" font-weight="700">Danh mục Sản phẩm &amp; Quy cách Đơn vị tính (UOM)</text>

  <!-- Header CTA Buttons -->
  <rect x="1116" y="92" width="136" height="38" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
  <text x="1184" y="116" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">Nhập / Xuất .xlsx</text>
  <rect x="1264" y="92" width="152" height="38" rx="6" fill="#334155" />
  <text x="1340" y="116" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">+ Thêm sản phẩm</text>

  <!-- ZONE 2: Compact 1-Row KPI Strip (Y=144..192px) -->
  <g transform="translate(274, 142)">
    <rect x="0" y="0" width="272" height="48" rx="8" fill="#FFFFFF" stroke="#059669" stroke-width="1.5" />
    <text x="14" y="20" fill="#475569" font-size="11" font-weight="600">TỔNG SẢN PHẨM (ĐANG LỌC)</text>
    <text x="14" y="39" fill="#0F172A" font-size="18" font-weight="700" class="num">1.240 SKU</text>

    <rect x="284" y="0" width="272" height="48" rx="8" fill="#FFFFFF" stroke="#E6E8EA" />
    <text x="298" y="20" fill="#475569" font-size="11" font-weight="600">THEO DÕI LÔ / HẠN DÙNG (FEFO)</text>
    <text x="298" y="39" fill="#047857" font-size="18" font-weight="700" class="num">318 SKU</text>

    <rect x="568" y="0" width="272" height="48" rx="8" fill="#FFFFFF" stroke="#E6E8EA" />
    <text x="582" y="20" fill="#475569" font-size="11" font-weight="600">THEO DÕI SỐ SÊ-RI (SERIAL)</text>
    <text x="582" y="39" fill="#0F172A" font-size="18" font-weight="700" class="num">94 SKU</text>

    <rect x="852" y="0" width="290" height="48" rx="8" fill="#FFFBEB" stroke="#F59E0B" />
    <text x="866" y="20" fill="#92400E" font-size="11" font-weight="700">CHẠM NGƯỠNG TỒN TỐI THIỂU (ROP)</text>
    <text x="866" y="39" fill="#92400E" font-size="18" font-weight="700" class="num">12 SKU cần đặt hàng</text>
  </g>

  <!-- ZONE 3: UiTabs (Y=198..236px) - Eliminates Vertical Card Stacking! -->
  <rect x="274" y="198" width="1142" height="38" rx="8" fill="#F2F3F4" stroke="#E6E8EA" />
  <rect x="278" y="202" width="230" height="30" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
  <text x="375" y="221" fill="#0F172A" font-size="12" font-weight="700" text-anchor="middle">Danh sách Sản phẩm</text>
  <rect x="462" y="207" width="38" height="20" rx="10" fill="#E2E8F0" />
  <text x="481" y="221" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle" class="num">1.240</text>

  <text x="640" y="221" fill="#475569" font-size="12" font-weight="600" text-anchor="middle">Ma trận Quy đổi Đơn vị (UOM)</text>
  <text x="890" y="221" fill="#475569" font-size="12" font-weight="600" text-anchor="middle">Kiểm tra Mã vạch GS1 / UPC</text>
  <text x="1140" y="221" fill="#475569" font-size="12" font-weight="600" text-anchor="middle">Cấu hình Định mức Tồn (ROP)</text>

  <!-- Annotation Callout at Y=244px -->
  <line x1="254" y1="244" x2="1430" y2="244" stroke="#059669" stroke-width="1.5" stroke-dasharray="6,4" />
  <rect x="1170" y="234" width="246" height="20" rx="4" fill="#059669" />
  <text x="1293" y="248" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">Y = 244px: BẢNG CHÍNH NGAY TẦM MẮT</text>

  <!-- ZONE 4: Unified Filter Toolbar + Enterprise Data Table Card (Y=246..876px) -->
  <rect x="274" y="246" width="1142" height="630" rx="8" fill="#FFFFFF" stroke="#E6E8EA" />

  <!-- Integrated Filter Row -->
  <rect x="290" y="260" width="310" height="36" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
  <text x="304" y="283" fill="#64748B" font-size="12">Lọc theo mã SKU, tên hàng, mã vạch...</text>

  <rect x="612" y="260" width="180" height="36" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
  <text x="626" y="283" fill="#0F172A" font-size="12">Nhóm hàng: Tất cả ▾</text>

  <rect x="804" y="260" width="190" height="36" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
  <text x="818" y="283" fill="#0F172A" font-size="12">Theo dõi: Lô / Serial ▾</text>

  <rect x="1006" y="260" width="150" height="36" rx="6" fill="#F8FAFC" stroke="#CBD5E1" />
  <text x="1081" y="283" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">Mật độ: Gọn (36px)</text>

  <rect x="1290" y="260" width="110" height="36" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
  <text x="1345" y="283" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">Làm mới</text>

  <!-- Table Header -->
  <rect x="275" y="308" width="1140" height="38" fill="#F2F3F4" />
  <line x1="275" y1="308" x2="1415" y2="308" stroke="#CBD5E1" />
  <line x1="275" y1="346" x2="1415" y2="346" stroke="#CBD5E1" />
  <text x="292" y="331" fill="#475569" font-size="11" font-weight="700">MÃ SKU</text>
  <text x="410" y="331" fill="#475569" font-size="11" font-weight="700">TÊN SẢN PHẨM &amp; QUY CÁCH</text>
  <text x="720" y="331" fill="#475569" font-size="11" font-weight="700">ĐVT CƠ SỞ</text>
  <text x="830" y="331" fill="#475569" font-size="11" font-weight="700">CHÍNH SÁCH LÔ/HSD</text>
  <text x="1080" y="331" fill="#475569" font-size="11" font-weight="700" text-anchor="end">TỒN THỰC TẾ</text>
  <text x="1210" y="331" fill="#475569" font-size="11" font-weight="700" text-anchor="end">TỒN KHẢ DỤNG</text>
  <text x="1398" y="331" fill="#475569" font-size="11" font-weight="700" text-anchor="end">THAO TÁC</text>

  <!-- Row 1 -->
  <g transform="translate(0, 346)">
    <rect x="275" y="0" width="1140" height="48" fill="#FFFFFF" />
    <line x1="275" y1="48" x2="1415" y2="48" stroke="#E6E8EA" />
    <text x="292" y="29" fill="#0F172A" font-size="13" font-weight="700" class="mono">SKU-MILK-01</text>
    <text x="410" y="23" fill="#0F172A" font-size="13" font-weight="600">Sữa tươi tiệt trùng nguyên kem 1L</text>
    <text x="410" y="40" fill="#64748B" font-size="11">1 Thùng = 12 Hộp • Barcode: 8934673100120</text>
    <text x="720" y="29" fill="#0F172A" font-size="13">Hộp</text>
    <!-- Semantic Status Badge with 6px dot -->
    <rect x="830" y="13" width="132" height="24" rx="12" fill="#ECFDF5" />
    <circle cx="842" cy="25" r="3.5" fill="#047857" />
    <text x="852" y="29" fill="#047857" font-size="11" font-weight="700">Bắt buộc Lô + HSD</text>
    <text x="1080" y="29" fill="#0F172A" font-size="13" font-weight="600" text-anchor="end" class="num">2.400 Hộp</text>
    <text x="1210" y="29" fill="#047857" font-size="13" font-weight="700" text-anchor="end" class="num">2.160 Hộp</text>
    <rect x="1260" y="9" width="66" height="30" rx="5" fill="#FFFFFF" stroke="#CBD5E1" />
    <text x="1293" y="28" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">Sửa</text>
    <rect x="1334" y="9" width="68" height="30" rx="5" fill="#FFFFFF" stroke="#CBD5E1" />
    <text x="1368" y="28" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">Thẻ kho</text>
  </g>

  <!-- Row 2 -->
  <g transform="translate(0, 394)">
    <rect x="275" y="0" width="1140" height="48" fill="#F8FAFC" />
    <line x1="275" y1="48" x2="1415" y2="48" stroke="#E6E8EA" />
    <text x="292" y="29" fill="#0F172A" font-size="13" font-weight="700" class="mono">SKU-ELEC-88</text>
    <text x="410" y="23" fill="#0F172A" font-size="13" font-weight="600">Sạc dự phòng không dây 20.000mAh</text>
    <text x="410" y="40" fill="#64748B" font-size="11">1 Thùng = 20 Cái • Barcode: 8938501928114</text>
    <text x="720" y="29" fill="#0F172A" font-size="13">Cái</text>
    <rect x="830" y="13" width="128" height="24" rx="12" fill="#E0F2FE" stroke="#7DD3FC" />
    <circle cx="842" cy="25" r="3.5" fill="#0369A1" />
    <text x="852" y="29" fill="#0369A1" font-size="11" font-weight="700">Theo dõi Sê-ri</text>
    <text x="1080" y="29" fill="#0F172A" font-size="13" font-weight="600" text-anchor="end" class="num">450 Cái</text>
    <text x="1210" y="29" fill="#047857" font-size="13" font-weight="700" text-anchor="end" class="num">380 Cái</text>
    <rect x="1260" y="9" width="66" height="30" rx="5" fill="#FFFFFF" stroke="#CBD5E1" />
    <text x="1293" y="28" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">Sửa</text>
    <rect x="1334" y="9" width="68" height="30" rx="5" fill="#FFFFFF" stroke="#CBD5E1" />
    <text x="1368" y="28" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">Thẻ kho</text>
  </g>

  <!-- Row 3 -->
  <g transform="translate(0, 442)">
    <rect x="275" y="0" width="1140" height="48" fill="#FFFFFF" />
    <line x1="275" y1="48" x2="1415" y2="48" stroke="#E6E8EA" />
    <text x="292" y="29" fill="#0F172A" font-size="13" font-weight="700" class="mono">SKU-PACK-04</text>
    <text x="410" y="23" fill="#0F172A" font-size="13" font-weight="600">Thùng Carton 3 lớp 30×20×15cm</text>
    <text x="410" y="40" fill="#64748B" font-size="11">1 Kiện = 50 Cái • Vật tư đóng gói</text>
    <text x="720" y="29" fill="#0F172A" font-size="13">Cái</text>
    <rect x="830" y="13" width="114" height="24" rx="12" fill="#FFFBEB" />
    <circle cx="842" cy="25" r="3.5" fill="#92400E" />
    <text x="852" y="29" fill="#92400E" font-size="11" font-weight="700">Chạm ngưỡng ROP</text>
    <text x="1080" y="29" fill="#0F172A" font-size="13" font-weight="600" text-anchor="end" class="num">120 Cái</text>
    <text x="1210" y="29" fill="#92400E" font-size="13" font-weight="700" text-anchor="end" class="num">80 Cái</text>
    <rect x="1260" y="9" width="66" height="30" rx="5" fill="#FFFFFF" stroke="#CBD5E1" />
    <text x="1293" y="28" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">Sửa</text>
    <rect x="1334" y="9" width="68" height="30" rx="5" fill="#FFFFFF" stroke="#CBD5E1" />
    <text x="1368" y="28" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">Thẻ kho</text>
  </g>

  <!-- Pagination Footer inside Table Card -->
  <line x1="275" y1="820" x2="1415" y2="820" stroke="#E6E8EA" />
  <text x="292" y="852" fill="#475569" font-size="12" class="num">Hiển thị 1–25 trên tổng số 1.240 SKU (Server-side Pagination • pageSize = 25)</text>
  <rect x="1190" y="832" width="90" height="32" rx="6" fill="#F8FAFC" stroke="#CBD5E1" />
  <text x="1235" y="852" fill="#64748B" font-size="12" font-weight="600" text-anchor="middle">← Trang trước</text>
  <text x="1302" y="852" fill="#0F172A" font-size="12" font-weight="700" text-anchor="middle" class="num">1 / 50</text>
  <rect x="1325" y="832" width="76" height="32" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
  <text x="1363" y="852" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">Tiếp →</text>
</svg>
