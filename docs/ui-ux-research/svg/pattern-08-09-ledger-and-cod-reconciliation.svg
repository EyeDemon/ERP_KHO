<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" width="100%" height="100%" font-family="Inter, 'Be Vietnam Pro', system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .num { font-variant-numeric: tabular-nums; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; font-variant-numeric: tabular-nums; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="#F8FAFC" />

  <!-- PART A: Pattern 08 - 6-State Inventory Balance Formula & Blind Stocktake Table -->
  <text x="24" y="32" fill="#475569" font-size="11" font-weight="700" letter-spacing="0.08em">MẪU 08: CÂN ĐỐI TỒN KHO 6 TRẠNG THÁI &amp; BẢNG KIỂM KÊ ĐẾM MÙ 2 LẦN (BLIND STOCKTAKE)</text>
  <rect x="24" y="44" width="1152" height="320" rx="8" fill="#FFFFFF" stroke="#E6E8EA" />

  <!-- Mathematical Inventory Identity Bar -->
  <rect x="40" y="60" width="1120" height="58" rx="8" fill="#F8FAFC" stroke="#CBD5E1" />
  <text x="56" y="82" fill="#475569" font-size="11" font-weight="700">BẤT BIẾN CÂN ĐỐI TỒN KHO (9 CHIỀU ĐỊNH DANH = SỔ CÁI INVENTORY LEDGER):</text>
  <text x="56" y="104" fill="#0F172A" font-size="14" font-weight="700" class="num">
    Tồn thực tế (1.000) = Khả dụng (750) + Giữ chỗ SO (150) + Đã phân bổ Pick (80) + Đang khóa/QC (20)  •  Lệch Sổ cái: 0
  </text>
  <rect x="980" y="72" width="164" height="34" rx="6" fill="#ECFDF5" stroke="#059669" />
  <text x="1062" y="94" fill="#047857" font-size="12" font-weight="700" text-anchor="middle">✓ Khớp Sổ cái 100%</text>

  <!-- Blind Stocktake Header -->
  <text x="40" y="144" fill="#0F172A" font-size="15" font-weight="700">Phiếu Kiểm kê Kho #ST-2026-102 (Đếm mù Lần 1 &amp; Lần 2 — Ẩn cột Tồn sổ sách với Nhân viên đếm)</text>
  <rect x="40" y="156" width="1120" height="36" fill="#F2F3F4" stroke="#CBD5E1" />
  <text x="54" y="179" fill="#475569" font-size="11" font-weight="700">VỊ TRÍ (BIN)</text>
  <text x="160" y="179" fill="#475569" font-size="11" font-weight="700">MÃ SKU &amp; SỐ LÔ (LOT)</text>
  <text x="470" y="179" fill="#475569" font-size="11" font-weight="700" text-anchor="end">TỒN SỔ SÁCH</text>
  <text x="595" y="179" fill="#475569" font-size="11" font-weight="700" text-anchor="end">ĐẾM LẦN 1 (NV A)</text>
  <text x="725" y="179" fill="#475569" font-size="11" font-weight="700" text-anchor="end">ĐẾM LẦN 2 (NV B)</text>
  <text x="835" y="179" fill="#475569" font-size="11" font-weight="700" text-anchor="end">LỆCH CUỐI</text>
  <text x="970" y="179" fill="#475569" font-size="11" font-weight="700">CHÍNH SÁCH DUNG SAI</text>
  <text x="1146" y="179" fill="#475569" font-size="11" font-weight="700" text-anchor="end">QUYẾT ĐỊNH</text>

  <!-- Stocktake Row 1: Exact Match -->
  <g transform="translate(40, 192)">
    <rect x="0" y="0" width="1120" height="44" fill="#FFFFFF" stroke="#E6E8EA" />
    <text x="14" y="27" fill="#0F172A" font-size="12" font-weight="700" class="mono">A01-L1-B1</text>
    <text x="120" y="27" fill="#0F172A" font-size="12" font-weight="600">SKU-MILK-01 • Lô: LOT-202609 (Hộp)</text>
    <text x="430" y="27" fill="#0F172A" font-size="13" font-weight="600" text-anchor="end" class="num">500</text>
    <text x="555" y="27" fill="#047857" font-size="13" font-weight="700" text-anchor="end" class="num">500</text>
    <text x="685" y="27" fill="#64748B" font-size="13" text-anchor="end">—</text>
    <text x="795" y="27" fill="#047857" font-size="13" font-weight="700" text-anchor="end" class="num">0</text>
    <text x="930" y="27" fill="#64748B" font-size="12">Không lệch (0%)</text>
    <rect x="1008" y="10" width="98" height="24" rx="12" fill="#ECFDF5" />
    <text x="1057" y="26" fill="#047857" font-size="11" font-weight="700" text-anchor="middle">✓ Khớp 100%</text>
  </g>

  <!-- Stocktake Row 2: Minor Variance Auto-Approve -->
  <g transform="translate(40, 236)">
    <rect x="0" y="0" width="1120" height="44" fill="#F8FAFC" stroke="#E6E8EA" />
    <text x="14" y="27" fill="#0F172A" font-size="12" font-weight="700" class="mono">A01-L2-B2</text>
    <text x="120" y="27" fill="#0F172A" font-size="12" font-weight="600">SKU-MILK-02 • Lô: LOT-202610 (Hộp)</text>
    <text x="430" y="27" fill="#0F172A" font-size="13" font-weight="600" text-anchor="end" class="num">200</text>
    <text x="555" y="27" fill="#92400E" font-size="13" font-weight="700" text-anchor="end" class="num">199</text>
    <text x="685" y="27" fill="#92400E" font-size="13" font-weight="700" text-anchor="end" class="num">199</text>
    <text x="795" y="27" fill="#92400E" font-size="13" font-weight="700" text-anchor="end" class="num">−1</text>
    <text x="930" y="27" fill="#047857" font-size="12" font-weight="600">Lệch 0,5% (&lt;= ngưỡng 1%)</text>
    <rect x="996" y="8" width="110" height="28" rx="6" fill="#ECFDF5" stroke="#059669" />
    <text x="1051" y="26" fill="#047857" font-size="11" font-weight="700" text-anchor="middle">Tự duyệt lệch nhỏ</text>
  </g>

  <!-- Stocktake Row 3: Major Variance Requires Manager Approval -->
  <g transform="translate(40, 280)">
    <rect x="0" y="0" width="1120" height="48" fill="#FEF2F2" stroke="#FCA5A5" />
    <text x="14" y="29" fill="#B91C1C" font-size="12" font-weight="700" class="mono">A02-L1-B4</text>
    <text x="120" y="29" fill="#0F172A" font-size="12" font-weight="700">SKU-ELEC-88 • Lô: LOT-202611 (Cái)</text>
    <text x="430" y="29" fill="#0F172A" font-size="13" font-weight="700" text-anchor="end" class="num">100</text>
    <text x="555" y="29" fill="#B91C1C" font-size="13" font-weight="700" text-anchor="end" class="num">84</text>
    <text x="685" y="29" fill="#B91C1C" font-size="13" font-weight="700" text-anchor="end" class="num">85</text>
    <text x="795" y="29" fill="#B91C1C" font-size="14" font-weight="800" text-anchor="end" class="num">−15</text>
    <text x="930" y="29" fill="#B91C1C" font-size="12" font-weight="700">Vượt ngưỡng 15%! Cần duyệt</text>
    <rect x="996" y="9" width="110" height="30" rx="6" fill="#334155" />
    <text x="1051" y="28" fill="#FFFFFF" font-size="11" font-weight="700" text-anchor="middle">Duyệt điều chỉnh</text>
  </g>

  <!-- PART B: Pattern 09 - 3-Way COD Reconciliation & 1.5% Tax (NĐ 70/2025) -->
  <text x="24" y="400" fill="#475569" font-size="11" font-weight="700" letter-spacing="0.08em">MẪU 09: ĐỐI SOÁT COD 3 CHIỀU, PHÍ ĐVVC &amp; KHẤU TRỪ THUẾ TMĐT 1,5% (NGHỊ ĐỊNH 70/2025)</text>
  <rect x="24" y="412" width="1152" height="324" rx="8" fill="#FFFFFF" stroke="#E6E8EA" />

  <!-- Financial Equation Bar -->
  <g transform="translate(40, 428)">
    <rect x="0" y="0" width="210" height="60" rx="6" fill="#F8FAFC" stroke="#CBD5E1" />
    <text x="12" y="22" fill="#475569" font-size="11" font-weight="600">1. TỔNG COD PHẢI THU (HỆ THỐNG)</text>
    <text x="198" y="46" fill="#0F172A" font-size="16" font-weight="700" text-anchor="end" class="num">450.000.000 đ</text>

    <text x="220" y="38" fill="#475569" font-size="18" font-weight="700">−</text>

    <rect x="236" y="0" width="190" height="60" rx="6" fill="#F8FAFC" stroke="#CBD5E1" />
    <text x="248" y="22" fill="#475569" font-size="11" font-weight="600">2. CƯỚC ĐVVC &amp; PHÍ HOÀN</text>
    <text x="414" y="46" fill="#0F172A" font-size="16" font-weight="700" text-anchor="end" class="num">18.500.000 đ</text>

    <text x="436" y="38" fill="#475569" font-size="18" font-weight="700">−</text>

    <rect x="452" y="0" width="210" height="60" rx="6" fill="#FFFBEB" stroke="#F59E0B" />
    <text x="464" y="22" fill="#92400E" font-size="11" font-weight="700">3. THUẾ TMĐT 1,5% (NĐ 70/2025)</text>
    <text x="650" y="46" fill="#92400E" font-size="16" font-weight="700" text-anchor="end" class="num">6.750.000 đ</text>

    <text x="672" y="38" fill="#475569" font-size="18" font-weight="700">=</text>

    <rect x="688" y="0" width="216" height="60" rx="6" fill="#ECFDF5" stroke="#059669" />
    <text x="700" y="22" fill="#047857" font-size="11" font-weight="700">4. THỰC NHẬN KỲ VỌNG</text>
    <text x="892" y="46" fill="#047857" font-size="16" font-weight="700" text-anchor="end" class="num">424.750.000 đ</text>

    <rect x="916" y="0" width="204" height="60" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5" />
    <text x="928" y="22" fill="#B91C1C" font-size="11" font-weight="700">5. CHÊNH LỆCH CẦN KHIẾU NẠI</text>
    <text x="1108" y="46" fill="#B91C1C" font-size="16" font-weight="800" text-anchor="end" class="num">−1.550.000 đ (4 đơn)</text>
  </g>

  <!-- Quick Filter Chips -->
  <g transform="translate(40, 502)">
    <rect x="0" y="0" width="140" height="32" rx="6" fill="#F2F3F4" stroke="#CBD5E1" />
    <text x="70" y="20" fill="#475569" font-size="12" font-weight="600" text-anchor="middle">Tất cả (320 đơn)</text>

    <rect x="150" y="0" width="210" height="32" rx="6" fill="#FEF2F2" stroke="#EF4444" stroke-width="1.5" />
    <text x="255" y="20" fill="#B91C1C" font-size="12" font-weight="700" text-anchor="middle">● Chỉ hiện đơn lệch (4 đơn)</text>

    <rect x="370" y="0" width="220" height="32" rx="6" fill="#F8FAFC" stroke="#CBD5E1" />
    <text x="480" y="20" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">Lệch trọng lượng DIM (2 đơn)</text>

    <rect x="920" y="0" width="200" height="32" rx="6" fill="#334155" />
    <text x="1020" y="20" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">Kết xuất bảng kê MISA (.xlsx)</text>
  </g>

  <!-- 3-Way COD Table -->
  <rect x="40" y="546" width="1120" height="36" fill="#F2F3F4" stroke="#CBD5E1" />
  <text x="54" y="569" fill="#475569" font-size="11" font-weight="700">MÃ VẬN ĐƠN (AWB)</text>
  <text x="210" y="569" fill="#475569" font-size="11" font-weight="700">ĐVVC / SÀN</text>
  <text x="430" y="569" fill="#475569" font-size="11" font-weight="700" text-anchor="end">COD HỆ THỐNG (1)</text>
  <text x="580" y="569" fill="#475569" font-size="11" font-weight="700" text-anchor="end">COD ĐVVC BÁO (2)</text>
  <text x="715" y="569" fill="#475569" font-size="11" font-weight="700" text-anchor="end">PHÍ SHIP (3)</text>
  <text x="855" y="569" fill="#475569" font-size="11" font-weight="700" text-anchor="end">THUẾ 1,5% NĐ70</text>
  <text x="995" y="569" fill="#475569" font-size="11" font-weight="700" text-anchor="end">THỰC NHẬN</text>
  <text x="1146" y="569" fill="#475569" font-size="11" font-weight="700" text-anchor="end">CHÊNH LỆCH</text>

  <!-- COD Row 1 (Discrepancy Highlighted) -->
  <g transform="translate(40, 582)">
    <rect x="0" y="0" width="1120" height="48" fill="#FEF2F2" stroke="#FCA5A5" />
    <text x="14" y="29" fill="#B91C1C" font-size="13" font-weight="700" class="mono">GHTK-8829104</text>
    <text x="170" y="29" fill="#0F172A" font-size="12" font-weight="600">GHTK • Shopee Mall</text>
    <text x="390" y="29" fill="#0F172A" font-size="13" font-weight="600" text-anchor="end" class="num">850.000 đ</text>
    <text x="540" y="29" fill="#B91C1C" font-size="13" font-weight="700" text-anchor="end" class="num">550.000 đ</text>
    <text x="675" y="29" fill="#0F172A" font-size="13" text-anchor="end" class="num">42.000 đ</text>
    <text x="815" y="29" fill="#92400E" font-size="13" font-weight="600" text-anchor="end" class="num">12.750 đ</text>
    <text x="955" y="29" fill="#0F172A" font-size="13" font-weight="700" text-anchor="end" class="num">495.250 đ</text>
    <text x="1106" y="29" fill="#B91C1C" font-size="13" font-weight="800" text-anchor="end" class="num">−300.000 đ</text>
  </g>

  <!-- COD Row 2 (Matched) -->
  <g transform="translate(40, 630)">
    <rect x="0" y="0" width="1120" height="48" fill="#FFFFFF" stroke="#E6E8EA" />
    <text x="14" y="29" fill="#0F172A" font-size="13" font-weight="700" class="mono">GHN-1920481</text>
    <text x="170" y="29" fill="#0F172A" font-size="12" font-weight="600">GHN • TikTok Shop</text>
    <text x="390" y="29" fill="#0F172A" font-size="13" font-weight="600" text-anchor="end" class="num">1.000.000 đ</text>
    <text x="540" y="29" fill="#047857" font-size="13" font-weight="600" text-anchor="end" class="num">1.000.000 đ</text>
    <text x="675" y="29" fill="#0F172A" font-size="13" text-anchor="end" class="num">35.000 đ</text>
    <text x="815" y="29" fill="#92400E" font-size="13" font-weight="600" text-anchor="end" class="num">15.000 đ</text>
    <text x="955" y="29" fill="#047857" font-size="13" font-weight="700" text-anchor="end" class="num">950.000 đ</text>
    <text x="1106" y="29" fill="#047857" font-size="13" font-weight="700" text-anchor="end" class="num">0 đ ✓</text>
  </g>
</svg>
