<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 740" width="100%" height="100%" font-family="Inter, 'Be Vietnam Pro', system-ui, -apple-system, sans-serif">
  <defs>
    <style>
      .num { font-variant-numeric: tabular-nums; }
      .mono { font-family: 'JetBrains Mono', Consolas, monospace; }
    </style>
  </defs>

  <rect width="1200" height="740" fill="#F8FAFC" />

  <!-- Header -->
  <text x="24" y="34" fill="#475569" font-size="11" font-weight="700" letter-spacing="0.08em">QUẢN TRỊ BẢO MẬT &amp; PHÂN QUYỀN (RBAC) • MẪU 03: PIVOT MATRIX</text>
  <text x="24" y="60" fill="#0F172A" font-size="20" font-weight="700">Ma trận Phân quyền (124 Quyền × 5 Vai trò) — Giảm từ 629 nút xuống còn &lt; 135 nút</text>

  <!-- Top UiTabs Separating 4 Security Workbenches -->
  <rect x="24" y="76" width="1152" height="40" rx="8" fill="#F2F3F4" stroke="#E6E8EA" />
  <rect x="28" y="80" width="280" height="32" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
  <text x="168" y="101" fill="#0F172A" font-size="12" font-weight="700" text-anchor="middle">🛡️ Ma trận Phân quyền (124)</text>

  <text x="450" y="101" fill="#475569" font-size="12" font-weight="600" text-anchor="middle">🔐 Bảo mật Tài khoản &amp; TOTP 2FA</text>
  <text x="725" y="101" fill="#475569" font-size="12" font-weight="600" text-anchor="middle">🏭 Phạm vi Kho (Warehouse Scopes)</text>
  <text x="1015" y="101" fill="#475569" font-size="12" font-weight="600" text-anchor="middle">⏱️ Hỗ trợ TTL 30p &amp; Nhật ký Audit</text>

  <!-- Matrix Card -->
  <rect x="24" y="128" width="1152" height="588" rx="8" fill="#FFFFFF" stroke="#E6E8EA" />

  <!-- Filter Toolbar -->
  <rect x="40" y="144" width="340" height="36" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
  <text x="54" y="167" fill="#64748B" font-size="12">Tìm quyền: "giá vốn", "receipt.complete", "kiểm kê"...</text>

  <rect x="392" y="144" width="220" height="36" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
  <text x="406" y="167" fill="#0F172A" font-size="12">Phân hệ: Tất cả (8 nhóm) ▾</text>

  <rect x="624" y="144" width="190" height="36" rx="6" fill="#FFFFFF" stroke="#CBD5E1" />
  <text x="638" y="167" fill="#0F172A" font-size="12">Vai trò: Tất cả (5 cột) ▾</text>

  <rect x="826" y="144" width="156" height="36" rx="6" fill="#F8FAFC" stroke="#CBD5E1" />
  <text x="904" y="167" fill="#334155" font-size="12" font-weight="600" text-anchor="middle">Thu gọn 8 nhóm</text>

  <rect x="994" y="144" width="166" height="36" rx="6" fill="#ECFDF5" stroke="#059669" />
  <text x="1077" y="167" fill="#047857" font-size="12" font-weight="700" text-anchor="middle">Chỉ hiện quyền nhạy cảm</text>

  <!-- Sticky Pivot Table Header -->
  <rect x="40" y="194" width="1120" height="48" fill="#F2F3F4" stroke="#CBD5E1" />
  <text x="56" y="215" fill="#334155" font-size="11" font-weight="700">DANH MỤC QUYỀN HẠN NGHIỆP VỤ</text>
  <text x="56" y="232" fill="#64748B" font-size="11">(Gom theo 8 Nhóm Phân hệ Accordion)</text>

  <!-- 5 Role Columns -->
  <text x="540" y="215" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">QUẢN TRỊ VIÊN</text>
  <text x="540" y="232" fill="#047857" font-size="11" font-weight="700" text-anchor="middle" class="num">Admin (124/124)</text>

  <text x="680" y="215" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">QUẢN LÝ KHO</text>
  <text x="680" y="232" fill="#475569" font-size="11" font-weight="600" text-anchor="middle" class="num">Manager (98/124)</text>

  <text x="820" y="215" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">NHÂN VIÊN KHO</text>
  <text x="820" y="232" fill="#475569" font-size="11" font-weight="600" text-anchor="middle" class="num">Staff (42/124)</text>

  <text x="960" y="215" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">KẾ TOÁN KHO</text>
  <text x="960" y="232" fill="#475569" font-size="11" font-weight="600" text-anchor="middle" class="num">Accountant (64/124)</text>

  <text x="1095" y="215" fill="#0F172A" font-size="11" font-weight="700" text-anchor="middle">NGƯỜI XEM</text>
  <text x="1095" y="232" fill="#64748B" font-size="11" font-weight="600" text-anchor="middle" class="num">Viewer (28/124)</text>

  <!-- Accordion Group 1 (Collapsed) -->
  <rect x="40" y="242" width="1120" height="38" fill="#F8FAFC" stroke="#E6E8EA" />
  <text x="56" y="266" fill="#0F172A" font-size="12" font-weight="700">▶ NHÓM 1: DANH MỤC SẢN PHẨM, CẤU TRÚC KHO &amp; ĐỐI TÁC (18 quyền — Nhấp để mở rộng)</text>
  <text x="540" y="266" fill="#047857" font-size="12" font-weight="700" text-anchor="middle" class="num">18/18</text>
  <text x="680" y="266" fill="#334155" font-size="12" font-weight="600" text-anchor="middle" class="num">18/18</text>
  <text x="820" y="266" fill="#64748B" font-size="12" text-anchor="middle" class="num">6/18</text>
  <text x="960" y="266" fill="#334155" font-size="12" font-weight="600" text-anchor="middle" class="num">12/18</text>
  <text x="1095" y="266" fill="#64748B" font-size="12" text-anchor="middle" class="num">6/18</text>

  <!-- Accordion Group 2 (Expanded: Inbound & Inventory Cost) -->
  <rect x="40" y="280" width="1120" height="38" fill="#EFF6FF" stroke="#BFDBFE" />
  <text x="56" y="304" fill="#1E3A8A" font-size="12" font-weight="700">▼ NHÓM 2: NHẬP KHO, KIỂM ĐỊNH QC &amp; BẢO MẬT GIÁ VỐN (Đang mở — 4/16 quyền hiển thị)</text>

  <!-- Permission Row 2.1 -->
  <g transform="translate(40, 318)">
    <rect x="0" y="0" width="1120" height="48" fill="#FFFFFF" stroke="#E6E8EA" />
    <text x="20" y="21" fill="#0F172A" font-size="13" font-weight="600">Xem danh sách &amp; chi tiết Phiếu nhập kho</text>
    <text x="20" y="38" fill="#64748B" font-size="11" class="mono">receipt.read</text>
    <!-- Checkboxes -->
    <rect x="488" y="12" width="24" height="24" rx="5" fill="#059669" /><text x="500" y="29" fill="#FFF" font-size="14" font-weight="700" text-anchor="middle">✓</text>
    <rect x="628" y="12" width="24" height="24" rx="5" fill="#334155" /><text x="640" y="29" fill="#FFF" font-size="14" font-weight="700" text-anchor="middle">✓</text>
    <rect x="768" y="12" width="24" height="24" rx="5" fill="#334155" /><text x="780" y="29" fill="#FFF" font-size="14" font-weight="700" text-anchor="middle">✓</text>
    <rect x="908" y="12" width="24" height="24" rx="5" fill="#334155" /><text x="920" y="29" fill="#FFF" font-size="14" font-weight="700" text-anchor="middle">✓</text>
    <rect x="1043" y="12" width="24" height="24" rx="5" fill="#334155" /><text x="1055" y="29" fill="#FFF" font-size="14" font-weight="700" text-anchor="middle">✓</text>
  </g>

  <!-- Permission Row 2.2 -->
  <g transform="translate(40, 366)">
    <rect x="0" y="0" width="1120" height="48" fill="#F8FAFC" stroke="#E6E8EA" />
    <text x="20" y="21" fill="#0F172A" font-size="13" font-weight="600">Tiếp nhận hàng hóa thực tế tại cửa kho (Dock Receive)</text>
    <text x="20" y="38" fill="#64748B" font-size="11" class="mono">receipt.receive</text>
    <rect x="488" y="12" width="24" height="24" rx="5" fill="#059669" /><text x="500" y="29" fill="#FFF" font-size="14" font-weight="700" text-anchor="middle">✓</text>
    <rect x="628" y="12" width="24" height="24" rx="5" fill="#334155" /><text x="640" y="29" fill="#FFF" font-size="14" font-weight="700" text-anchor="middle">✓</text>
    <rect x="768" y="12" width="24" height="24" rx="5" fill="#334155" /><text x="780" y="29" fill="#FFF" font-size="14" font-weight="700" text-anchor="middle">✓</text>
    <rect x="908" y="12" width="24" height="24" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <rect x="1043" y="12" width="24" height="24" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
  </g>

  <!-- Permission Row 2.3 -->
  <g transform="translate(40, 414)">
    <rect x="0" y="0" width="1120" height="48" fill="#FFFFFF" stroke="#E6E8EA" />
    <text x="20" y="21" fill="#0F172A" font-size="13" font-weight="600">Duyệt hoàn tất &amp; Ghi sổ tăng tồn kho (Post Ledger)</text>
    <text x="20" y="38" fill="#64748B" font-size="11" class="mono">receipt.complete</text>
    <rect x="488" y="12" width="24" height="24" rx="5" fill="#059669" /><text x="500" y="29" fill="#FFF" font-size="14" font-weight="700" text-anchor="middle">✓</text>
    <rect x="628" y="12" width="24" height="24" rx="5" fill="#334155" /><text x="640" y="29" fill="#FFF" font-size="14" font-weight="700" text-anchor="middle">✓</text>
    <rect x="768" y="12" width="24" height="24" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
    <rect x="908" y="12" width="24" height="24" rx="5" fill="#334155" /><text x="920" y="29" fill="#FFF" font-size="14" font-weight="700" text-anchor="middle">✓</text>
    <rect x="1043" y="12" width="24" height="24" rx="5" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5" />
  </g>

  <!-- Permission Row 2.4 (Sensitive Cost Permission Highlighted!) -->
  <g transform="translate(40, 462)">
    <rect x="0" y="0" width="1120" height="52" fill="#FFFBEB" stroke="#FCD34D" />
    <text x="20" y="22" fill="#92400E" font-size="13" font-weight="700">🔒 Xem Giá vốn MAC, Giá nhập, Lợi nhuận gộp &amp; Đối soát COD</text>
    <text x="20" y="40" fill="#B45309" font-size="11" class="mono">inventory.cost.read • Quyền nhạy cảm (Ẩn giá vốn với Nhân viên kho &amp; Người xem)</text>
    <rect x="488" y="14" width="24" height="24" rx="5" fill="#059669" /><text x="500" y="31" fill="#FFF" font-size="14" font-weight="700" text-anchor="middle">✓</text>
    <rect x="628" y="14" width="24" height="24" rx="5" fill="#334155" /><text x="640" y="31" fill="#FFF" font-size="14" font-weight="700" text-anchor="middle">✓</text>
    <rect x="768" y="14" width="24" height="24" rx="5" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5" /><text x="780" y="30" fill="#B91C1C" font-size="12" font-weight="700" text-anchor="middle">✕</text>
    <rect x="908" y="14" width="24" height="24" rx="5" fill="#334155" /><text x="920" y="31" fill="#FFF" font-size="14" font-weight="700" text-anchor="middle">✓</text>
    <rect x="1043" y="14" width="24" height="24" rx="5" fill="#FEF2F2" stroke="#FCA5A5" stroke-width="1.5" /><text x="1055" y="30" fill="#B91C1C" font-size="12" font-weight="700" text-anchor="middle">✕</text>
  </g>

  <!-- Remaining Collapsed Groups -->
  <rect x="40" y="514" width="1120" height="36" fill="#F8FAFC" stroke="#E6E8EA" />
  <text x="56" y="537" fill="#0F172A" font-size="12" font-weight="700">▶ NHÓM 3: XUẤT KHO, PHÂN BỔ FEFO, PICKING &amp; ĐÓNG GÓI (22 quyền)</text>

  <rect x="40" y="550" width="1120" height="36" fill="#FFFFFF" stroke="#E6E8EA" />
  <text x="56" y="573" fill="#0F172A" font-size="12" font-weight="700">▶ NHÓM 4: TỒN KHO 9 CHIỀU, TRUY VẾT LÔ/SÊ-RI &amp; SỔ CÁI BẤT BIẾN (20 quyền)</text>

  <rect x="40" y="586" width="1120" height="36" fill="#F8FAFC" stroke="#E6E8EA" />
  <text x="56" y="609" fill="#0F172A" font-size="12" font-weight="700">▶ NHÓM 5: KIỂM KÊ ĐẾM MÙ, ĐIỀU CHUYỂN LIÊN KHO &amp; KHÓA TỒN (16 quyền)</text>

  <!-- Floating Unsaved Changes Action Bar -->
  <rect x="40" y="640" width="1120" height="56" rx="8" fill="#0F172A" />
  <text x="64" y="673" fill="#FFFFFF" font-size="13" font-weight="600">Đang chọn sửa 2 quyền cho vai trò Quản lý kho (RowVersion kiểm tra chống ghi đè 409)</text>
  <rect x="850" y="650" width="110" height="36" rx="6" fill="#1E293B" stroke="#475569" />
  <text x="905" y="673" fill="#CBD5E1" font-size="12" font-weight="600" text-anchor="middle">Hoàn tác</text>
  <rect x="972" y="650" width="170" height="36" rx="6" fill="#059669" />
  <text x="1057" y="673" fill="#FFFFFF" font-size="12" font-weight="700" text-anchor="middle">Lưu ma trận quyền</text>
</svg>
